#app.backend.url=http://localhost:8080
# --- Suscripción (Etapa 5) ---
# Días de gracia tras una factura vencida antes de pasar a solo lectura
suscripcion.gracia-dias=${SUSCRIPCION_GRACIA_DIAS:7}
# Cada cuánto se concilia con Flow (ISO-8601) y cuánto espera tras arrancar
suscripcion.sync-intervalo=${SUSCRIPCION_SYNC_INTERVALO:PT6H}
suscripcion.sync-inicial=${SUSCRIPCION_SYNC_INICIAL:PT3M}
suscripcion.sync-habilitado=${SUSCRIPCION_SYNC_HABILITADO:true}
