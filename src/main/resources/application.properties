spring.application.name=PosBarLacteo

# IMPRESCINDIBLE PARA RENDER: Asigna el puerto dinámico de Render (o 8080 en local)
server.port=${PORT:8080}

# Base de datos (Usa MySQL local por defecto si no hay variable)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tu_base_local?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tu_password_local}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Zona horaria del negocio (Chile). Afecta fechas de ventas, turnos y DTE.
app.timezone=${APP_TIMEZONE:America/Santiago}
spring.jackson.time-zone=${APP_TIMEZONE:America/Santiago}

# Seguridad JWT. OBLIGATORIO: definir JWT_SECRET en Render (mínimo 32 caracteres, aleatorio).
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:10}

# CORS: se permite app.frontend.url + estos orígenes extra (separados por coma).
app.cors.extra-origins=${CORS_EXTRA_ORIGINS:http://localhost:5173}

# Credenciales Flow (sandbox por defecto; en producción: https://www.flow.cl/api)
flow.api.key=${FLOW_API_KEY}
flow.secret.key=${FLOW_SECRET_KEY}
flow.base-url=${FLOW_BASE_URL:https://sandbox.flow.cl/api}

# Correo saliente (Gmail con "contraseña de aplicación"). Sin MAIL_USERNAME el envío queda deshabilitado.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000

# Comprobantes de transferencia (bucket S3 privado). S3_ENDPOINT solo si usas un servicio compatible (R2, MinIO).
app.s3.bucket=${S3_BUCKET:}
app.s3.region=${S3_REGION:sa-east-1}
app.s3.access-key=${S3_ACCESS_KEY:}
app.s3.secret-key=${S3_SECRET_KEY:}
app.s3.endpoint=${S3_ENDPOINT:}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# La URL de tu React alojado (Vercel o dominio propio)
app.frontend.url=${APP_FRONTEND_URL:https://www.kipipos.cl}

# La URL PÚBLICA donde está alojado tu Spring Boot (es crucial que Flow pueda llegar aquí)
app.backend.url=${APP_BACKEND_URL:https://kipiweb-backend.onrender.com}


#para local:

#app.frontend.url=http://localhost:5173
#app.backend.url=http://localhost:8080
# --- Suscripción (Etapa 5) ---
# Días de gracia tras una factura vencida antes de pasar a solo lectura
suscripcion.gracia-dias=${SUSCRIPCION_GRACIA_DIAS:7}
# Cada cuánto se concilia con Flow (ISO-8601) y cuánto espera tras arrancar
suscripcion.sync-intervalo=${SUSCRIPCION_SYNC_INTERVALO:PT6H}
suscripcion.sync-inicial=${SUSCRIPCION_SYNC_INICIAL:PT3M}
suscripcion.sync-habilitado=${SUSCRIPCION_SYNC_HABILITADO:true}

# --- Etapa 11: prueba gratuita sin tarjeta y baja de cuenta ---
# Días de prueba gratuita al registrarse (sin tarjeta). Al vencer, la cuenta queda en solo lectura hasta activar la suscripción.
suscripcion.prueba-dias=${SUSCRIPCION_PRUEBA_DIAS:30}
# Plan de Flow al que se suscribe al inscribir la tarjeta. DEBE ser un plan SIN días de prueba (el cobro parte al activar).
flow.plan-id=${FLOW_PLAN_ID:KIPI}
# Tras dar de baja la cuenta, días de gracia antes de borrar los datos definitivamente
suscripcion.baja-dias=${SUSCRIPCION_BAJA_DIAS:30}
# Proceso que borra las cuentas dadas de baja vencidas (false = nunca borra, solo acumula)
suscripcion.borrado-habilitado=${SUSCRIPCION_BORRADO_HABILITADO:true}
suscripcion.borrado-inicial=${SUSCRIPCION_BORRADO_INICIAL:PT10M}
suscripcion.borrado-intervalo=${SUSCRIPCION_BORRADO_INTERVALO:PT6H}
# Avisos por correo de fin de prueba (10 y 3 días antes, y al vencer)
suscripcion.avisos-habilitado=${SUSCRIPCION_AVISOS_HABILITADO:true}
suscripcion.avisos-inicial=${SUSCRIPCION_AVISOS_INICIAL:PT5M}
suscripcion.avisos-intervalo=${SUSCRIPCION_AVISOS_INTERVALO:PT6H}

# --- Etapa 7: legal, contacto y anti-abuso ---
# Versión vigente de los Términos y Condiciones / Privacidad (debe coincidir con VITE_LEGAL_VERSION... ver src/config/legal.ts)
legal.terminos-version=${LEGAL_TERMINOS_VERSION:2026-11-03}
# Correo que recibe los mensajes del formulario de contacto (por defecto, el mismo MAIL_USERNAME)
app.contacto.destino=${CONTACTO_DESTINO:}
# Cloudflare Turnstile: clave SECRETA del widget. Sin ella el captcha no se verifica.
turnstile.secret=${TURNSTILE_SECRET:}

# Panel del dueño (app de escritorio). Token largo y secreto; si queda vacío, /api/owner/** está desactivado.
owner.api-token=${OWNER_API_TOKEN:}
